<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scrib</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; height: 100vh; overflow: hidden; font-family: monospace; }
canvas#canvas { background: #fff; display: block; position: fixed; top: 44px; left: 48px; right: 0; bottom: 52px; }

/* Left tool panel */
#leftPanel {
  position: fixed; left: 0; top: 0; bottom: 0; width: 48px;
  background: #232323; z-index: 20;
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 0; gap: 2px;
}
.tool-btn {
  width: 36px; height: 36px; border: none; border-radius: 8px;
  background: transparent; color: #888; cursor: pointer;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: background 0.1s;
}
.tool-btn:hover { background: #333; color: #ddd; }
.tool-btn.active { background: #e86a20; color: #fff; }
.tool-btn.active:hover { background: #f08030; }
#leftPanel .sep { width: 24px; height: 1px; background: #333; margin: 6px 0; }

/* Top bar */
#topBar {
  position: fixed; top: 0; left: 48px; right: 0; height: 44px;
  background: #232323; z-index: 20;
  display: flex; align-items: center; gap: 4px; padding: 0 10px;
}
#topBar button {
  padding: 5px 9px; border: none; border-radius: 6px;
  background: transparent; color: #aaa; cursor: pointer;
  font-family: monospace; font-size: 13px; transition: background 0.1s;
  white-space: nowrap;
}
#topBar button:hover { background: #333; color: #eee; }
#topBar .sep { width: 1px; height: 20px; background: #333; margin: 0 4px; }
#topBar .tog-on { background: rgba(232,106,32,0.15); color: #e86a20; }
#topBar .tog-on:hover { background: rgba(232,106,32,0.25); color: #f08030; }
#bgToggle.tog-on { background: transparent; color: #e86a20; }
#bgToggle.tog-on:hover { background: #333; color: #f08030; }
#topBar .zoom-label { color: #ccc; font-size: 12px; min-width: 34px; text-align: center; }
#topBar .icon-btn { font-size: 16px; padding: 5px 8px; }

/* Bottom bar */
#bottomBar {
  position: fixed; bottom: 0; left: 48px; right: 0; height: 52px;
  background: #232323; z-index: 20;
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
}
.swatches { display: flex; align-items: center; gap: 6px; }
.swatch { width: 24px; height: 24px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; transition: border-color 0.1s; flex-shrink: 0; }
.swatch.active { border-color: #e86a20; }
.swatch-picker { display: none; }
.swatch-picker-btn { width: 24px; height: 24px; border-radius: 6px; border: 1.5px dashed #555; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #666; transition: border-color 0.15s, color 0.15s, background 0.15s; background: #2a2a2a; position: relative; }
.swatch-picker-btn:hover { border-color: #e86a20; color: #e86a20; }
.swatch-picker-btn.active { border-style: solid; border-color: #e86a20; }
.size-wrap { display: flex; align-items: center; gap: 8px; color: #999; font-size: 12px; }
.size-wrap input { width: 80px; accent-color: #e86a20; cursor: pointer; }
.size-wrap span { min-width: 24px; text-align: center; color: #ccc; }
.size-preview { width: 20px; height: 20px; border-radius: 50%; background: red; flex-shrink: 0; transition: background 0.15s, transform 0.15s; border: 1px solid rgba(255,255,255,0.15); }
#bottomInfo { color: #555; font-size: 11px; margin-left: auto; white-space: nowrap; }

/* Shortcuts overlay */
#shortcutsOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: none; align-items: center; justify-content: center; }
#shortcutsOverlay.open { display: flex; }
#shortcutsPanel { background: #232323; border-radius: 10px; padding: 24px 32px; max-width: 420px; width: 90%; color: #ccc; font-size: 13px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
#shortcutsPanel h2 { margin: 0 0 16px; font-size: 15px; color: #eee; }
#shortcutsPanel .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; }
#shortcutsPanel .row:last-child { border-bottom: none; }
#shortcutsPanel .keys { color: #e86a20; }
#shortcutsPanel .keys kbd { background: #333; padding: 1px 6px; border-radius: 3px; font-family: monospace; font-size: 12px; color: #ddd; margin: 0 2px; }
</style>
</head>
<body>

<!-- Left tool panel -->
<div id="leftPanel">
  <button class="tool-btn active" id="tooldraw" title="Pen (D)"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2a2.2 2.2 0 0 1 3 3L6 16l-4 1 1-4Z"/><path d="m12 4 3 3"/></svg></button>
  <button class="tool-btn" id="tooleraser" title="Eraser (E)"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13l4 4 8-8-4-4-8 8z"/><path d="m9.5 5.5 3 3"/></svg></button>
  <div class="sep"></div>
  <button class="tool-btn" id="toolrect" title="Rectangle (R)">□</button>
  <button class="tool-btn" id="toolcircle" title="Circle (C)">○</button>
  <button class="tool-btn" id="toolline" title="Line (L)">╱</button>
  <button class="tool-btn" id="toolarrow" title="Arrow (A)">→</button>
</div>

<!-- Top bar -->
<div id="topBar">
  <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">↩</button>
  <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">↪</button>
  <div class="sep"></div>
  <button id="clear">Clear</button>
  <div class="sep"></div>
  <button id="gridToggle" title="Grid (G)"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="16" height="16"/><line x1="2" y1="8" x2="18" y2="8"/><line x1="2" y1="14" x2="18" y2="14"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="14" y1="2" x2="14" y2="18"/></svg></button>
  <button id="bgToggle" class="tog-on" title="Toggle dark/light mode"><svg id="bgIcon" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 10.79A8 8 0 1 1 9.21 3 6 6 0 0 0 17 10.79z"/></svg></button>
  <div class="sep"></div>
  <button class="icon-btn" id="zoomOut" title="Zoom out">−</button>
  <span class="zoom-label" id="zoomLabel">100%</span>
  <button class="icon-btn" id="zoomIn" title="Zoom in">+</button>
  <button id="zoomReset">Fit</button>
  <div style="flex:1"></div>
  <button id="shortcutsBtn" style="font-weight:bold;color:#e86a20">?</button>
</div>

<!-- Bottom bar -->
<div id="bottomBar">
  <div class="swatches">
    <div class="swatch" data-color="#222" style="background:#222"></div>
    <div class="swatch" data-color="#e33" style="background:#e33"></div>
    <div class="swatch" data-color="#33e" style="background:#33e"></div>
    <div class="swatch" data-color="#3a3" style="background:#3a3"></div>
    <div class="swatch" data-color="#e83" style="background:#e83"></div>
    <div class="swatch" data-color="#eee" style="background:#eee;border:1px solid #555"></div>
    <input type="color" id="customColor" class="swatch-picker" value="#e86a20">
    <div id="customColorBtn" class="swatch-picker-btn" title="Custom color">+</div>
  </div>
  <div class="size-wrap">
    <label>Size</label>
    <div id="sizePreview" class="size-preview"></div>
    <input type="range" id="sizeSlider" min="1" max="20" step="0.5" value="10">
    <span id="sizeLabel">10.0</span>
  </div>
  <span id="bottomInfo">scrib · scroll zoom · middle-drag pan</span>
</div>

<!-- Shortcuts overlay -->
<div id="shortcutsOverlay">
  <div id="shortcutsPanel">
    <h2>Keyboard Shortcuts</h2>
    <div class="row"><span>Pen tool</span><span class="keys"><kbd>D</kbd></span></div>
    <div class="row"><span>Eraser</span><span class="keys"><kbd>E</kbd></span></div>
    <div class="row"><span>Rectangle</span><span class="keys"><kbd>R</kbd></span></div>
    <div class="row"><span>Circle</span><span class="keys"><kbd>C</kbd></span></div>
    <div class="row"><span>Line</span><span class="keys"><kbd>L</kbd></span></div>
    <div class="row"><span>Arrow</span><span class="keys"><kbd>A</kbd></span></div>
    <div class="row"><span>Cancel tool</span><span class="keys"><kbd>Esc</kbd></span></div>
    <div class="row"><span>Undo</span><span class="keys"><kbd>Ctrl</kbd>+<kbd>Z</kbd></span></div>
    <div class="row"><span>Redo</span><span class="keys"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> or <kbd>Ctrl</kbd>+<kbd>Y</kbd></span></div>
    <div class="row"><span>Toggle grid</span><span class="keys"><kbd>G</kbd></span></div>
    <div class="row"><span>Pan (hold + drag)</span><span class="keys"><kbd>Space</kbd> + drag</span></div>
    <div class="row"><span>Zoom</span><span class="keys">Scroll wheel</span></div>
    <div class="row"><span>Pan</span><span class="keys">Middle‑click + drag</span></div>
  </div>
</div>

<!-- Canvas -->
<canvas id="canvas"></canvas>
<canvas id="cursorCanvas" style="position:fixed;top:44px;left:48px;right:0;bottom:52px;pointer-events:none;z-index:5;background:transparent;"></canvas>

<script type="module">
import init, { process_stroke, mesh_from_centerline, shape_mesh, hit_path } from './pkg/scrib.js';
await init();

// ---- Constants ----
const EPSILON = 0.5;
const SEGMENTS = 6;
const MAX_UNDO = 100;
const GRID = 30;
const THROTTLE_DRAW = 80;
const THROTTLE_CURSOR = 40;
const TOOLS = ['draw', 'eraser', 'rect', 'circle', 'line', 'arrow'];

// ---- Canvas ----
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const cursorCanvas = document.getElementById('cursorCanvas');
const cursorCtx = cursorCanvas.getContext('2d');

// ---- State: document ----
const strokes = [];
const undoStack = [];
const redoStack = [];
let currentRaw = null;
let drawing = false;
let shaping = false;
let shapeStart = null;
let erasing = false;
let eraserPath = [];
let toErase = new Set();
let currentColor = '#eee';
let currentSize;
let currentTool = 'draw';

// ---- State: camera ----
let camX = 0, camY = 0, camZoom = 1;
let panning = false, panBtn = -1;
let panStartX = 0, panStartY = 0, panStartCamX = 0, panStartCamY = 0;
let spaceDown = false;
let showGrid = false;
let bgColor = '#1a1a1a';
const touchPoints = new Map();
let pinchStartDist = 0, pinchStartZoom = 1;
let pinchCenterX = 0, pinchCenterY = 0;
let pinchCamX = 0, pinchCamY = 0;

// ---- State: multiplayer ----
let ws = null;
let myId = -1;
let myColor = '#e86a20';
let roomId = '';
let remoteCursors = {};
let cursorThrottle = 0;
let currentStrokeId = null;
let currentShapeId = null;
let lastStrokeSendTime = 0;
let lastIncrTime = 0;
let cachedMesh = null;
let liveStrokes = {};
let liveShapes = {};

// ---- Undo / Redo ----
function saveState() {
  undoStack.push(JSON.parse(JSON.stringify(strokes)));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
}
function undo() {
  if (undoStack.length === 0) return;
  if (drawing) { drawing = false; currentRaw = null; }
  if (shaping) { shaping = false; shapeStart = null; }
  if (erasing) cancelErase();
  resetIncrCache();
  redoStack.push(JSON.parse(JSON.stringify(strokes)));
  const saved = undoStack.pop();
  strokes.length = 0;
  for (const s of saved) strokes.push(s);
  redraw();
}
function redo() {
  if (redoStack.length === 0) return;
  if (drawing) { drawing = false; currentRaw = null; }
  if (shaping) { shaping = false; shapeStart = null; }
  if (erasing) cancelErase();
  resetIncrCache();
  undoStack.push(JSON.parse(JSON.stringify(strokes)));
  const saved = redoStack.pop();
  strokes.length = 0;
  for (const s of saved) strokes.push(s);
  redraw();
}

// ---- Math helpers ----
function screenToCanvas(sx, sy) {
  return { x: (sx - camX) / camZoom, y: (sy - camY) / camZoom };
}
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const c = screenToCanvas(e.clientX - r.left, e.clientY - r.top);
  return { x: c.x, y: c.y, p: e.pressure || 0.5 };
}
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, ls = dx * dx + dy * dy;
  if (ls === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / ls;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function snap(val) { return showGrid ? Math.round(val / GRID) * GRID : val; }

// ---- Drawing primitives ----
function dot(x, y, color, size, pressure) {
  ctx.fillStyle = color;
  const r = (size / 2) * (0.3 + 0.7 * pressure);
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
function drawMesh(data, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < data.length; i += 6) {
    ctx.moveTo(data[i], data[i + 1]);
    ctx.lineTo(data[i + 2], data[i + 3]);
    ctx.lineTo(data[i + 4], data[i + 5]);
    ctx.closePath();
  }
  ctx.fill();
}
function drawShape(s) {
  if (s.mesh) { drawMesh(s.mesh, s.color); return; }
  ctx.strokeStyle = s.color;
  ctx.lineWidth = s.size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  if (s.type === 'rect') {
    ctx.rect(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2), Math.abs(s.x2 - s.x1), Math.abs(s.y2 - s.y1));
  } else if (s.type === 'circle') {
    const cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
    ctx.arc(cx, cy, Math.hypot(s.x2 - s.x1, s.y2 - s.y1) / 2, 0, Math.PI * 2);
  } else if (s.type === 'line' || s.type === 'arrow') {
    ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2);
  }
  ctx.stroke();
  if (s.type === 'arrow' && Math.hypot(s.x2 - s.x1, s.y2 - s.y1) >= 1) {
    const a = Math.atan2(s.y2 - s.y1, s.x2 - s.x1), hl = s.size * 3, ha = Math.PI / 6;
    ctx.beginPath();
    ctx.moveTo(s.x2, s.y2);
    ctx.lineTo(s.x2 - hl * Math.cos(a - ha), s.y2 - hl * Math.sin(a - ha));
    ctx.moveTo(s.x2, s.y2);
    ctx.lineTo(s.x2 - hl * Math.cos(a + ha), s.y2 - hl * Math.sin(a + ha));
    ctx.stroke();
  }
}
function drawGrid() {
  if (!showGrid) return;
  const col = bgColor === '#ffffff' ? '#e0e0e0' : '#333333';
  const l = -camX / camZoom, t = -camY / camZoom;
  const r = l + canvas.width / camZoom, b = t + canvas.height / camZoom;
  ctx.strokeStyle = col;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = Math.floor(l / GRID) * GRID; x <= r; x += GRID) {
    const sx = x * camZoom + camX;
    ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height);
  }
  for (let y = Math.floor(t / GRID) * GRID; y <= b; y += GRID) {
    const sy = y * camZoom + camY;
    ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy);
  }
  ctx.stroke();
}
function drawCursor(c, cxt) {
  const g = cxt || ctx;
  g.beginPath();
  g.arc(c.x, c.y, 5, 0, Math.PI * 2);
  g.fillStyle = c.color;
  g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.25)';
  g.lineWidth = 1.5;
  g.stroke();
}

// ---- Hit testing ----
function hitStroke(px, py) {
  for (let i = strokes.length - 1; i >= 0; i--) {
    if (toErase.has(i)) continue;
    const s = strokes[i];
    const t = Math.max(s.size / 2, 4);
    if (s.type === 'dot') {
      if (Math.hypot(px - s.x, py - s.y) <= t) return i;
    } else if (s.type === 'path') {
      if (s.data && hit_path(px, py, s.data, s.size)) return i;
    } else if (s.type === 'rect') {
      const l = Math.min(s.x1, s.x2), r = Math.max(s.x1, s.x2);
      const u = Math.min(s.y1, s.y2), d = Math.max(s.y1, s.y2);
      if (Math.hypot(px - Math.max(l, Math.min(r, px)), py - Math.max(u, Math.min(d, py))) <= t) return i;
    } else if (s.type === 'circle') {
      const cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
      if (Math.abs(Math.hypot(px - cx, py - cy) - Math.hypot(s.x2 - s.x1, s.y2 - s.y1) / 2) <= t) return i;
    } else if (s.type === 'line' || s.type === 'arrow') {
      if (distToSegment(px, py, s.x1, s.y1, s.x2, s.y2) <= t) return i;
    }
  }
  return -1;
}

// ---- Eraser ----
function cancelErase() {
  erasing = false;
  toErase = new Set();
  eraserPath = [];
  redraw();
}

// ---- Tool management ----
function setTool(tool) {
  if (shaping) { shaping = false; shapeStart = null; redraw(); }
  if (drawing) { drawing = false; currentRaw = null; }
  if (erasing) cancelErase();
  resetIncrCache();
  currentTool = tool;
  for (const id of TOOLS)
    document.getElementById('tool' + id)?.classList.toggle('active', id === tool);
  canvas.style.cursor = tool === 'eraser' ? 'pointer' : 'crosshair';
}

// ---- Camera / zoom ----
function updateZoomDisplay() {
  const el = document.getElementById('zoomLabel');
  if (el) el.textContent = Math.round(camZoom * 100) + '%';
}
function zoomTo(newZoom) {
  const cx = (canvas.width / 2 - camX) / camZoom, cy = (canvas.height / 2 - camY) / camZoom;
  camZoom = Math.max(0.1, Math.min(10, newZoom));
  camX = canvas.width / 2 - cx * camZoom;
  camY = canvas.height / 2 - cy * camZoom;
  updateZoomDisplay();
  redraw();
}

// ---- Incremental stroke processing ----
const CAP_FLOATS = 8 * 6; // mesh_from_centerline uses cap_segments=8
const INCR_THROTTLE = 30;
let cachedCenterline = null;

function resetIncrCache() {
  cachedCenterline = null;
  cachedMesh = null;
}

function processStrokeIncremental(raw) {
  const cl = Array.from(process_stroke(raw, EPSILON, SEGMENTS, currentSize));

  if (cachedCenterline && cachedMesh && cachedCenterline.length >= 6) {
    let diffIdx = 0;
    const minLen = Math.min(cachedCenterline.length, cl.length);
    while (diffIdx + 2 < minLen &&
           cl[diffIdx] === cachedCenterline[diffIdx] &&
           cl[diffIdx + 1] === cachedCenterline[diffIdx + 1]) {
      diffIdx += 3;
    }

    if (diffIdx >= 6) {
      const overlapIdx = (diffIdx / 3) | 0; // first changed point index
      const keepSegs = overlapIdx - 1;       // body segments 0..overlapIdx-2 are unchanged
      const tail = cl.slice((overlapIdx - 1) * 3); // 1 overlap point for body continuity
      const tailMesh = Array.from(mesh_from_centerline(tail));

      const bodyStart = CAP_FLOATS;
      const keepLen = keepSegs > 0 ? keepSegs * 12 : 0;
      const merged = cachedMesh.slice(0, bodyStart + keepLen)
        .concat(tailMesh.slice(CAP_FLOATS));

      cachedCenterline = cl;
      cachedMesh = merged;
      return { data: cl, mesh: merged };
    }
  }

  const mesh = Array.from(mesh_from_centerline(cl));
  cachedCenterline = cl;
  cachedMesh = mesh;
  return { data: cl, mesh: mesh };
}
function finalizeStroke() {
  if (!currentRaw) return;
  saveState();
  let obj;
  if (currentRaw.length === 3) {
    obj = { type: 'dot', x: currentRaw[0], y: currentRaw[1], color: currentColor, size: currentSize, pressure: currentRaw[2] };
    strokes.push(obj);
  } else if (currentRaw.length > 3) {
    const data = Array.from(process_stroke(currentRaw, EPSILON, SEGMENTS, currentSize));
    const mesh = Array.from(mesh_from_centerline(data));
    obj = { type: 'path', data, mesh, color: currentColor, size: currentSize };
    strokes.push(obj);
  }
  if (ws?.readyState === WebSocket.OPEN && currentStrokeId) {
    ws.send(JSON.stringify({type: 'stroke-end', data: {id: currentStrokeId, stroke: obj}}));
  }
  currentRaw = null;
  currentStrokeId = null;
  resetIncrCache();
}

// ---- Pointer handlers ----
function handleDown(x, y, pressure) {
  if (currentTool === 'eraser') {
    erasing = true;
    eraserPath = [x, y];
    toErase = new Set();
    return;
  }
  if (currentTool === 'draw') {
    drawing = true;
    currentRaw = [x, y, pressure];
    currentStrokeId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    cachedMesh = null;
    resetIncrCache();
    lastStrokeSendTime = 0;
    if (ws?.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type: 'stroke-start', data: {id: currentStrokeId, color: currentColor, size: currentSize}}));
    }
    return;
  }
  shaping = true;
  currentShapeId = 'shape_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  shapeStart = { x: snap(x), y: snap(y), x2: snap(x), y2: snap(y) };
}
function handleMove(x, y) {
  if (currentTool === 'eraser') {
    if (!erasing) return;
    eraserPath.push(x, y);
    const idx = hitStroke(x, y);
    if (idx >= 0) toErase.add(idx);
    if (eraserPath.length >= 4) {
      const mx = (eraserPath[eraserPath.length - 4] + x) / 2;
      const my = (eraserPath[eraserPath.length - 3] + y) / 2;
      const idx2 = hitStroke(mx, my);
      if (idx2 >= 0) toErase.add(idx2);
    }
    redraw();
    return;
  }
  if (currentTool === 'draw') {
    if (!drawing) return;
    currentRaw.push(x, y, 0.5);
    const now = Date.now();
    if (currentRaw.length > 3 && now - lastIncrTime > INCR_THROTTLE) {
      lastIncrTime = now;
      const { mesh } = processStrokeIncremental(currentRaw);
      cachedMesh = mesh;
    }
    if (now - lastStrokeSendTime > THROTTLE_DRAW && ws?.readyState === WebSocket.OPEN && currentStrokeId && cachedMesh) {
      lastStrokeSendTime = now;
      ws.send(JSON.stringify({type: 'stroke-update', data: {id: currentStrokeId, mesh: cachedMesh}}));
    }
    redraw();
    return;
  }
  if (!shaping) return;
  shapeStart.x2 = snap(x);
  shapeStart.y2 = snap(y);
  const now = Date.now();
  if (now - lastStrokeSendTime > THROTTLE_DRAW && ws?.readyState === WebSocket.OPEN && currentShapeId) {
    lastStrokeSendTime = now;
    ws.send(JSON.stringify({type: 'shape-update', data: {
      id: currentShapeId,
      shape: { type: currentTool, x1: shapeStart.x, y1: shapeStart.y, x2: shapeStart.x2, y2: shapeStart.y2, color: currentColor, size: currentSize }
    }}));
  }
  redraw();
}
function handleUp() {
  if (currentTool === 'eraser') {
    if (!erasing) return;
    erasing = false;
    saveState();
    const sorted = [...toErase].sort((a, b) => b - a);
    for (const idx of sorted) strokes.splice(idx, 1);
    toErase = new Set();
    eraserPath = [];
    redraw();
    return;
  }
  if (currentTool === 'draw') {
    if (!drawing) return;
    drawing = false;
    finalizeStroke();
    redraw();
    return;
  }
  if (!shaping) return;
  shaping = false;
  if (Math.abs(shapeStart.x2 - shapeStart.x) > 2 || Math.abs(shapeStart.y2 - shapeStart.y) > 2) {
    saveState();
    const mesh = Array.from(shape_mesh(currentTool, shapeStart.x, shapeStart.y, shapeStart.x2, shapeStart.y2, currentSize, 32));
    const obj = { type: currentTool, x1: shapeStart.x, y1: shapeStart.y, x2: shapeStart.x2, y2: shapeStart.y2, mesh, color: currentColor, size: currentSize };
    strokes.push(obj);
    if (ws?.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type: 'stroke-end', data: {id: currentShapeId, stroke: obj}}));
    }
  }
  shapeStart = null;
  currentShapeId = null;
  redraw();
}

// ---- Redraw ----
function redraw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  ctx.setTransform(camZoom, 0, 0, camZoom, camX, camY);

  for (let i = 0; i < strokes.length; i++) {
    const s = strokes[i];
    ctx.globalAlpha = toErase.has(i) ? 0.25 : 1;
    if (s.type === 'dot') dot(s.x, s.y, s.color, s.size, s.pressure);
    else if (s.type === 'path') drawMesh(s.mesh, s.color);
    else drawShape(s);
  }
  ctx.globalAlpha = 1;

  for (const id in liveStrokes) { const ls = liveStrokes[id]; if (ls.mesh) drawMesh(ls.mesh, ls.color); }
  for (const id in liveShapes) drawShape(liveShapes[id]);

  if (shaping && shapeStart) {
    const previewMesh = shape_mesh(currentTool, shapeStart.x, shapeStart.y, shapeStart.x2, shapeStart.y2, currentSize, 32);
    drawMesh(previewMesh, currentColor);
  }

  if (currentTool === 'draw' && currentRaw && currentRaw.length >= 3) {
    if (currentRaw.length === 3) dot(currentRaw[0], currentRaw[1], currentColor, currentSize, currentRaw[2]);
    else if (cachedMesh) drawMesh(cachedMesh, currentColor);
  }

  redrawCursors();
}

function redrawCursors() {
  cursorCtx.setTransform(1, 0, 0, 1, 0, 0);
  cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
  cursorCtx.setTransform(camZoom, 0, 0, camZoom, camX, camY);
  for (const id in remoteCursors) {
    const c = remoteCursors[id];
    if (c.x > -900) drawCursor(c, cursorCtx);
  }
  cursorCtx.setTransform(1, 0, 0, 1, 0, 0);
}

// ---- Multiplayer ----
function onWSInit(msg) {
  myId = msg.id;
  myColor = msg.color;
  for (const u of msg.users)
    if (u.id !== myId) remoteCursors[u.id] = {color: u.color, x: -999, y: -999};
  if (msg.strokes) {
    for (const entry of msg.strokes) {
      const s = entry.stroke;
      s.userId = entry.user_id;
      if (s.type !== 'path' && s.type !== 'dot' && !s.mesh) {
        s.mesh = Array.from(shape_mesh(s.type, s.x1, s.y1, s.x2, s.y2, s.size, 32));
      }
      strokes.push(s);
    }
  }
  updateUserCount();
}
function onWSJoin(msg) {
  remoteCursors[msg.id] = {color: msg.color, x: -999, y: -999};
  updateUserCount();
}
function onWSLeave(msg) {
  delete remoteCursors[msg.id];
  for (let i = strokes.length - 1; i >= 0; i--)
    if (strokes[i].userId === msg.id) strokes.splice(i, 1);
  updateUserCount();
  redraw();
}
function onWSStrokeEnd(msg) {
  if (!msg.data) return;
  delete liveStrokes[msg.data.id];
  delete liveShapes[msg.data.id];
  const s = msg.data.stroke || msg.data;
  s.userId = msg.id;
  if (s.type !== 'path' && s.type !== 'dot' && !s.mesh) {
    s.mesh = Array.from(shape_mesh(s.type, s.x1, s.y1, s.x2, s.y2, s.size, 32));
  }
  strokes.push(s);
  redraw();
}
function onWSStrokeStart(msg) {
  if (!msg.data) return;
  liveStrokes[msg.data.id] = { mesh: null, color: msg.data.color, size: msg.data.size };
  redraw();
}
function onWSStrokeUpdate(msg) {
  if (!msg.data || !liveStrokes[msg.data.id]) return;
  liveStrokes[msg.data.id].mesh = msg.data.mesh;
  redraw();
}
function onWSShapeUpdate(msg) {
  if (!msg.data) return;
  const s = msg.data.shape;
  if (s && s.type !== 'path' && s.type !== 'dot') {
    s.mesh = Array.from(shape_mesh(s.type, s.x1, s.y1, s.x2, s.y2, s.size, 32));
  }
  liveShapes[msg.data.id] = s;
  redraw();
}
function onWSCursor(msg) {
  if (!remoteCursors[msg.id]) return;
  remoteCursors[msg.id].x = msg.x;
  remoteCursors[msg.id].y = msg.y;
  redrawCursors();
}
function initWS() {
  roomId = location.hash.slice(1) || Math.random().toString(36).slice(2, 7);
  location.hash = roomId;
  const url = `ws://${location.hostname}:9876`;
  document.getElementById('bottomInfo').textContent = `Room: ${roomId} · connecting...`;
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify({type: 'join', room: roomId}));
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'init': onWSInit(msg); break;
      case 'join': onWSJoin(msg); break;
      case 'leave': onWSLeave(msg); break;
      case 'stroke-end': case 'stroke': onWSStrokeEnd(msg); break;
      case 'stroke-start': onWSStrokeStart(msg); break;
      case 'stroke-update': onWSStrokeUpdate(msg); break;
      case 'shape-update': onWSShapeUpdate(msg); break;
      case 'cursor': onWSCursor(msg); break;
    }
  };
  ws.onclose = () => {
    document.getElementById('bottomInfo').textContent = `Room: ${roomId} · disconnected`;
    ws = null;
  };
}
function updateUserCount() {
  document.getElementById('bottomInfo').textContent = `Room: ${roomId} · ${Object.keys(remoteCursors).length + 1} online`;
}
function sendCursor(x, y) {
  const now = Date.now();
  if (now - cursorThrottle < THROTTLE_CURSOR) return;
  cursorThrottle = now;
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type: 'cursor', x, y}));
}

initWS();

// ---- Size slider ----
const sizeSlider = document.getElementById('sizeSlider');
const sizeLabel = document.getElementById('sizeLabel');
function updateSize() {
  currentSize = parseFloat(sizeSlider.value);
  sizeLabel.textContent = currentSize.toFixed(1);
  const p = document.getElementById('sizePreview');
  const s = Math.max(2, Math.min(20, currentSize * 2));
  p.style.width = s + 'px'; p.style.height = s + 'px'; p.style.background = currentColor;
}
sizeSlider.addEventListener('input', updateSize);
updateSize();

// ---- Color swatches ----
document.querySelectorAll('.swatch').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    currentColor = el.dataset.color;
    document.getElementById('customColorBtn').style.background = '#2a2a2a';
    document.getElementById('customColorBtn').classList.remove('active');
    updateSize();
  });
});
document.querySelector('.swatch[data-color="#eee"]').classList.add('active');
document.getElementById('customColorBtn').addEventListener('click', () => document.getElementById('customColor').click());
document.getElementById('customColor').addEventListener('input', (e) => {
  currentColor = e.target.value;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  const btn = document.getElementById('customColorBtn');
  btn.style.background = currentColor;
  btn.classList.add('active');
  updateSize();
});

// ---- Tool buttons ----
document.getElementById('tooldraw').addEventListener('click', () => setTool('draw'));
document.getElementById('tooleraser').addEventListener('click', () => setTool('eraser'));
document.getElementById('toolrect').addEventListener('click', () => setTool('rect'));
document.getElementById('toolcircle').addEventListener('click', () => setTool('circle'));
document.getElementById('toolline').addEventListener('click', () => setTool('line'));
document.getElementById('toolarrow').addEventListener('click', () => setTool('arrow'));

document.getElementById('zoomIn').addEventListener('click', () => {
  const step = Math.round(camZoom / 0.25);
  const newZoom = Math.max(0.25, Math.min(10, (step + 1) * 0.25));
  const cx = (canvas.width / 2 - camX) / camZoom;
  const cy = (canvas.height / 2 - camY) / camZoom;
  camX = canvas.width / 2 - cx * newZoom;
  camY = canvas.height / 2 - cy * newZoom;
  camZoom = newZoom;
  updateZoomDisplay();
  redraw();
});
document.getElementById('zoomOut').addEventListener('click', () => {
  const step = Math.round(camZoom / 0.25);
  const newZoom = Math.max(0.25, Math.min(10, (step - 1) * 0.25));
  const cx = (canvas.width / 2 - camX) / camZoom;
  const cy = (canvas.height / 2 - camY) / camZoom;
  camX = canvas.width / 2 - cx * newZoom;
  camY = canvas.height / 2 - cy * newZoom;
  camZoom = newZoom;
  updateZoomDisplay();
  redraw();
});
document.getElementById('zoomReset').addEventListener('click', () => {
  camX = 0; camY = 0; camZoom = 1;
  updateZoomDisplay();
  redraw();
});

document.getElementById('gridToggle').addEventListener('click', () => {
  showGrid = !showGrid;
  document.getElementById('gridToggle').classList.toggle('tog-on', showGrid);
  redraw();
});

document.getElementById('bgToggle').addEventListener('click', () => {
  const isDark = bgColor !== '#1a1a1a';
  bgColor = isDark ? '#1a1a1a' : '#ffffff';
  document.getElementById('bgToggle').classList.toggle('tog-on', isDark);
  document.getElementById('bgIcon').innerHTML = isDark
    ? '<path d="M17 10.79A8 8 0 1 1 9.21 3 6 6 0 0 0 17 10.79z"/>'
    : '<circle cx="10" cy="10" r="4"/><line x1="10" y1="1" x2="10" y2="3"/><line x1="10" y1="17" x2="10" y2="19"/><line x1="3.05" y1="3.05" x2="4.46" y2="4.46"/><line x1="15.54" y1="15.54" x2="16.95" y2="16.95"/><line x1="1" y1="10" x2="3" y2="10"/><line x1="17" y1="10" x2="19" y2="10"/><line x1="3.05" y1="16.95" x2="4.46" y2="15.54"/><line x1="15.54" y1="4.46" x2="16.95" y2="3.05"/>';
  const newColor = isDark ? '#eee' : '#222';
  currentColor = newColor;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  document.querySelector(`.swatch[data-color="${newColor}"]`).classList.add('active');
  redraw();
});

document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);

const overlay = document.getElementById('shortcutsOverlay');
document.getElementById('shortcutsBtn').addEventListener('click', () => overlay.classList.toggle('open'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('clear').addEventListener('click', () => {
  saveState();
  strokes.length = 0;
  currentRaw = null;
  drawing = false;
  resetIncrCache();
  redraw();
});

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); spaceDown = true; }
  if (e.key === 'e' || e.key === 'E') setTool('eraser');
  if (e.key === 'd' || e.key === 'D') setTool('draw');
  if (e.key === 'r' || e.key === 'R') setTool('rect');
  if (e.key === 'c' || e.key === 'C') setTool('circle');
  if (e.key === 'l' || e.key === 'L') setTool('line');
  if (e.key === 'a' || e.key === 'A') setTool('arrow');
  if (e.key === 'g' || e.key === 'G') { document.getElementById('gridToggle').click(); }
  if (e.key === 'Escape') { if (overlay.classList.contains('open')) { overlay.classList.remove('open'); return; } if (currentTool === 'eraser') setTool('draw'); }
  if (e.key === '?' && !e.ctrlKey && !e.metaKey) { overlay.classList.toggle('open'); }
  if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey) && e.shiftKey) { redo(); }
  else if (e.key === 'y' && (e.ctrlKey || e.metaKey)) { redo(); }
  else if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { undo(); }
});
document.addEventListener('keyup', (e) => {
  if (e.key === ' ') spaceDown = false;
});

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();

  // Touch: track multi-touch
  if (e.pointerType === 'touch') {
    touchPoints.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touchPoints.size === 2) {
      if (erasing) cancelErase();
      drawing = false;
      currentRaw = null;
      const pts = [...touchPoints.values()];
      pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      pinchCenterX = (pts[0].x + pts[1].x) / 2;
      pinchCenterY = (pts[0].y + pts[1].y) / 2;
      pinchStartZoom = camZoom;
      pinchCamX = camX;
      pinchCamY = camY;
      return;
    }
    if (touchPoints.size > 1) return;
  }

  // Right click
  if (e.button === 2) { if (erasing) cancelErase(); if (currentTool === 'eraser') setTool('draw'); return; }

  // Middle click pan
  if (e.button === 1) {
    panning = true; panBtn = 1;
    panStartX = e.clientX; panStartY = e.clientY;
    panStartCamX = camX; panStartCamY = camY;
    return;
  }

  // Space + left click pan
  if (e.button === 0 && spaceDown) {
    panning = true; panBtn = 0;
    panStartX = e.clientX; panStartY = e.clientY;
    panStartCamX = camX; panStartCamY = camY;
    return;
  }

  // Draw / erase / shape
  if (e.button === 0) {
    const p = getPos(e);
    handleDown(p.x, p.y, p.p);
  }
});
canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();

  // Touch tracking
  if (e.pointerType === 'touch') {
    if (touchPoints.has(e.pointerId)) {
      touchPoints.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }
    if (touchPoints.size === 2) {
      const pts = [...touchPoints.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const cx = (pts[0].x + pts[1].x) / 2;
      const cy = (pts[0].y + pts[1].y) / 2;
      const dx = cx - pinchCenterX;
      const dy = cy - pinchCenterY;
      camZoom = Math.max(0.1, Math.min(10, pinchStartZoom * (dist / pinchStartDist)));
      camX = pinchCamX + dx;
      camY = pinchCamY + dy;
      updateZoomDisplay();
      redraw();
      return;
    }
    if (touchPoints.size > 2) return;
  }

  // Pan
  if (panning) {
    camX = panStartCamX + (e.clientX - panStartX);
    camY = panStartCamY + (e.clientY - panStartY);
    redraw();
    return;
  }

  // Send cursor to others
  const p = getPos(e);
  sendCursor(p.x, p.y);
  handleMove(p.x, p.y);
});
canvas.addEventListener('pointerup', (e) => {
  if (e.pointerType === 'touch') {
    touchPoints.delete(e.pointerId);
    if (touchPoints.size > 0) return;
  }
  if (panning) { panning = false; return; }
  handleUp();
});
canvas.addEventListener('pointercancel', (e) => {
  if (e.pointerType === 'touch') touchPoints.delete(e.pointerId);
  if (erasing) cancelErase();
  handleUp();
  panning = false;
});
canvas.addEventListener('pointerleave', () => { if (erasing) cancelErase(); });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.1, Math.min(10, camZoom * factor));
  const cx = (mx - camX) / camZoom;
  const cy = (my - camY) / camZoom;
  camX = mx - cx * newZoom;
  camY = my - cy * newZoom;
  camZoom = newZoom;
  updateZoomDisplay();
  redraw();
}, { passive: false });

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (erasing) cancelErase();
  if (currentTool === 'eraser') setTool('draw');
});

function resize() {
  const w = window.innerWidth - 48;
  const h = window.innerHeight - 44 - 52;
  canvas.width = w; canvas.height = h;
  cursorCanvas.width = w; cursorCanvas.height = h;
  redraw();
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
