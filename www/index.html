<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scrib</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; height: 100vh; overflow: hidden; font-family: monospace; }
  canvas { background: #fff; cursor: crosshair; display: block; position: fixed; top: 0; left: 0; }
  #toolbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  #toolbar button { padding: 6px 14px; border: none; border-radius: 4px; background: #333; color: #ddd; cursor: pointer; font-family: monospace; font-size: 13px; }
  #toolbar button:hover { background: #555; color: #fff; }
  #info { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: #555; font-size: 12px; z-index: 10; }
</style>
</head>
<body>
<div id="toolbar"><button id="clear">Clear</button></div>
<canvas id="canvas"></canvas>
<div id="info">scrib — draw with mouse or touch</div>
<script type="module">
import init, { process_stroke } from './pkg/scrib.js';

await init();
console.log('scrib WASM loaded');

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const EPSILON = 0.5;
const SEGMENTS = 6;

const strokes = [];
let currentRaw = null;
let drawing = false;

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top,
    p: e.pressure || 0.5,
  };
}

const LINE_W = 2.5;

function dot(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, LINE_W / 2, 0, Math.PI * 2);
  ctx.fill();
}

function path(data) {
  ctx.beginPath();
  ctx.moveTo(data[0], data[1]);
  for (let i = 2; i < data.length; i += 2) {
    ctx.lineTo(data[i], data[i + 1]);
  }
  ctx.stroke();
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#222';
  ctx.fillStyle = '#222';
  ctx.lineWidth = LINE_W;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (const s of strokes) {
    if (s.type === 'dot') {
      dot(s.x, s.y);
    } else {
      path(s.data);
    }
  }

  if (currentRaw && currentRaw.length >= 3) {
    if (currentRaw.length === 3) {
      dot(currentRaw[0], currentRaw[1]);
    } else {
      const result = process_stroke(currentRaw, EPSILON, SEGMENTS);
      path(result);
    }
  }
}

function finalizeStroke() {
  if (!currentRaw) return;
  if (currentRaw.length === 3) {
    strokes.push({ type: 'dot', x: currentRaw[0], y: currentRaw[1] });
  } else if (currentRaw.length > 3) {
    const result = process_stroke(currentRaw, EPSILON, SEGMENTS);
    strokes.push({ type: 'path', data: result });
  }
  currentRaw = null;
}

function startStroke(e) {
  const pos = getPos(e);
  drawing = true;
  currentRaw = [pos.x, pos.y, pos.p];
}

function continueStroke(e) {
  if (!drawing) return;
  const pos = getPos(e);
  currentRaw.push(pos.x, pos.y, pos.p);
  redraw();
}

function endStroke() {
  if (!drawing) return;
  drawing = false;
  finalizeStroke();
  redraw();
}

canvas.addEventListener('pointerdown', startStroke);
canvas.addEventListener('pointermove', continueStroke);
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
canvas.addEventListener('pointerleave', endStroke);

canvas.addEventListener('mousedown', startStroke);
canvas.addEventListener('mousemove', continueStroke);
canvas.addEventListener('mouseup', endStroke);
canvas.addEventListener('mouseleave', endStroke);

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  drawing = true;
  currentRaw = [t.clientX - rect.left, t.clientY - rect.top, 0.5];
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!drawing) return;
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  currentRaw.push(t.clientX - rect.left, t.clientY - rect.top, 0.5);
  redraw();
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  endStroke();
}, { passive: false });

document.getElementById('clear').addEventListener('click', () => {
  strokes.length = 0;
  currentRaw = null;
  drawing = false;
  redraw();
});

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  redraw();
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
