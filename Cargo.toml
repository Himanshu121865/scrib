[workspace]
members = ["server"]

[package]
name = "scrib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "Path2d",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "BinaryType",
] }

[features]
wasm = ["wasm-bindgen", "js-sys", "web-sys"]
